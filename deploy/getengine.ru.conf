server {
    listen 80;
    server_name getengine.ru;

    root /var/www/getengine.ru;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name workflow.getengine.ru;

    root /var/www/getengine.ru/workflow;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
