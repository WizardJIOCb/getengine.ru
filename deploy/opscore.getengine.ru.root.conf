server {
    server_name opscore.getengine.ru;

    root /var/www/opscore.getengine.ru;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location /api/ {
        try_files $uri /tg/ozna/api/index.php?$query_string;
    }

    location = /tg/ozna/api/index.php {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include /etc/nginx/fastcgi_params;
    }

    location /tg/ozna/api/ {
        try_files $uri /tg/ozna/api/index.php?$query_string;
    }

    location /tg/ozna/app/ {
        try_files $uri $uri/ /tg/ozna/app/index.html;
    }

    location ~ /\.ht {
        deny all;
        return 403;
    }

    location ~ \.php$ {
        deny all;
        return 403;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/opscore.getengine.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/opscore.getengine.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = opscore.getengine.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name opscore.getengine.ru;
    return 404; # managed by Certbot
}
